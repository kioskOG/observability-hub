# Grafana Alloy DaemonSet (release grafana-alloy) — overrides for the grafana/alloy chart
# (version pinned in helm/Chart.yaml). Only values that differ from the chart defaults belong here:
#   helm show values helm/charts/alloy-<version>.tgz
#
# The Alloy config lives in alloy/config/daemonset.alloy and is passed with
# --set-file alloy.configMap.content=… (make install-alloy). The chart renders it through tpl, so the
# custom values below (kafka.*, traceSampling.*) are read by template actions in that file.

# -- Kafka tee (River components gated in the config). KAFKA_* env vars use these anchors so
# broker/topic/clientId stay in sync. When enabled, log streams also go to KAFKA_TOPIC as OTLP;
# Loki still receives them directly.
kafka:
  enabled: false
  brokers: &kafka_brokers "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  topic: &kafka_topic "alloy-otel-logs"
  clientId: &kafka_client_id "grafana-alloy-logs"

# -- Trace sampling, applied ONCE before the Tempo + spanlogs fan-out. Span metrics (RED) stay on the
# unsampled path. In head mode every kept span carries sampling.ratio = percentage/100 so Tempo's
# service graph scales edge counts back to real traffic. Runbook: Docs/trace-to-logs.md
#
# mode:
#   off  — keep 100% of traces (dev / bring-up / Trace→Logs demos)
#   head — otelcol.processor.probabilistic_sampler (hash on trace ID; correct on a DaemonSet)
#   tail — otelcol.processor.tail_sampling (errors + latency + probabilistic baseline). All spans of a
#          trace must reach the same Alloy pod for correct decisions; no sampling.ratio is stamped,
#          so Tempo service-graph rates are not scaled. Prefer head on a DaemonSet.
traceSampling:
  mode: "head"
  head:
    # Percentage of traces to keep (0–100). Same trace ID → same decision on every pod.
    percentage: 10
    hashSeed: 22
  tail:
    decisionWait: 10s
    numTraces: 50000
    expectedNewTracesPerSec: 100
    # Always keep error / high-latency traces; sample the rest probabilistically.
    keepErrors: true
    latencyThresholdMs: 500
    probabilisticPercentage: 10

alloy:
  # content comes from alloy/config/daemonset.alloy via --set-file.
  configMap:
    name: alloy-config
    key: config.alloy

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: pyroscope # pyroscope.receive_http (SDK push)
      port: 4041
      targetPort: 4041
      protocol: TCP
    - name: faro # Grafana Faro Web SDK (RUM) → otelcol.receiver.faro
      port: 12347
      targetPort: 12347
      protocol: TCP

  # experimental is required for otelcol.receiver.faro (and covers pyroscope.*).
  stabilityLevel: "experimental"

  # On a hostPath (controller.volumes.extra) so file/journal read positions and the WAL survive pod
  # re-creation; on emptyDir every rollout re-read /var/log/pods from the start (duplicate logs).
  storagePath: /var/lib/alloy/data

  enableReporting: false

  # Helm replaces lists: a per-environment values file must repeat this whole list.
  extraEnv:
    - name: KUBE_CLUSTER_NAME
      value: "millenniumfalcon" # must equal kube-prometheus-stack clusterName (Makefile CLUSTER_NAME)
    # Also the Loki tenant: must be prod | stage | dev and match the loki-writer-<env> credential.
    - name: ENVIRONMENT_NAME
      value: "dev"
    - name: AWS_REGION
      value: "us-east-2"
    - name: CLOUD_PROVIDER
      value: "aws"
    - name: PLATFORM_TYPE
      value: "eks"
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: LOKI_GATEWAY_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: loki_gateway_username
    - name: LOKI_GATEWAY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: loki_gateway_password
    - name: MIMIR_REMOTE_WRITE_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: mimir_remote_write_username
    - name: MIMIR_REMOTE_WRITE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: mimir_remote_write_password
    # Present always; consumed only when kafka.enabled=true renders the exporter block.
    - name: KAFKA_BROKERS
      value: *kafka_brokers
    - name: KAFKA_TOPIC
      value: *kafka_topic
    - name: KAFKA_CLIENT_ID
      value: *kafka_client_id

  mounts:
    varlog: true
    dockercontainers: true
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy/data

  # Privileged because of eBPF profiling (pyroscope.ebpf).
  securityContext:
    privileged: true
    runAsGroup: 0
    runAsUser: 0

  # Logs + OTLP traces/metrics + spanmetrics state + eBPF/pprof profiles in one process; 500Mi OOM'd
  # under load. Requests sized for steady state, limit for bursts (tail sampling buffers, rollouts).
  resources:
    limits:
      memory: "1536Mi"
    requests:
      cpu: "200m"
      memory: "512Mi"

  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 12345
  readinessProbe:
    httpGet:
      path: /-/ready
      port: 12345

controller:
  # Run on every node, including the tainted observability node group.
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule
  # Node-level collector: keep it from being evicted before application pods.
  priorityClassName: system-node-critical
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  # pyroscope.ebpf needs the host PID namespace.
  hostPID: true
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy/data
          type: DirectoryOrCreate

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
