# Grafana Alloy — cluster-event collector (single replica).
#
# Kubernetes events are a cluster-wide stream: collecting them from the log DaemonSet
# (alloy-override-values.yaml) made every node ship every event (N× duplicates, and the per-pod
# `node` label kept Loki from de-duplicating). This release runs exactly one collector.
#
# StatefulSet + PVC: loki.source.kubernetes_events stores its last-seen position under
# storagePath, so a restart resumes instead of re-shipping the last hour of events.
#
# Install: make install-alloy-events (same namespace + Secret alloy-remote-credentials as the DaemonSet).

# -- Kafka tee (mirrors alloy-override-values.yaml; keep both in sync).
kafka:
  enabled: false
  brokers: &kafka_brokers "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  topic: &kafka_topic "alloy-otel-logs"
  clientId: &kafka_client_id "grafana-alloy-events"

# The PodLogs CRD comes from the DaemonSet release (grafana-alloy). It ships in the chart's crds/ dir,
# which Helm installs once, skips when the CRD already exists, and never upgrades or deletes, so
# setting true here is harmless. Nothing in alloy/config uses PodLogs (loki.source.podlogs) today.
crds:
  create: false

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

alloy:
  # Config: alloy/config/events.alloy, passed with --set-file alloy.configMap.content=… (make install-alloy-events).
  storagePath: /var/lib/alloy/data
  enableReporting: false

  # Keep label values identical to the DaemonSet (alloy-override-values.yaml).
  extraEnv:
    - name: KUBE_CLUSTER_NAME
      value: "millenniumfalcon"
    # Also the Loki tenant: must be prod | stage | dev and match the loki-writer-<env> credential.
    - name: ENVIRONMENT_NAME
      value: "dev"
    - name: AWS_REGION
      value: "us-east-2"
    - name: CLOUD_PROVIDER
      value: "aws"
    - name: PLATFORM_TYPE
      value: "eks"
    - name: LOKI_GATEWAY_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: loki_gateway_username
    - name: LOKI_GATEWAY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-remote-credentials
          key: loki_gateway_password
    - name: KAFKA_BROKERS
      value: *kafka_brokers
    - name: KAFKA_TOPIC
      value: *kafka_topic
    - name: KAFKA_CLIENT_ID
      value: *kafka_client_id

  # No host access needed: events come from the API server.
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: alloy-events-data
        mountPath: /var/lib/alloy/data
      - name: tmp # readOnlyRootFilesystem: give the process a writable /tmp
        mountPath: /tmp

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /-/healthy
      port: 12345
  readinessProbe:
    httpGet:
      path: /-/ready
      port: 12345

configReloader:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

controller:
  type: statefulset
  volumes:
    extra:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: alloy-events-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2-standard
        resources:
          requests:
            storage: 1Gi
  nodeSelector:
    workload: observability
  tolerations:
    - key: dedicated
      operator: Equal
      value: observability
      effect: NoSchedule

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
