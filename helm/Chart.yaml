# Every Helm chart the observability hub runs, with its pinned version. Single source of truth:
# the Makefile reads versions from here and installs the archives that `helm dependency build`
# downloads into helm/charts/ (git-ignored), exactly as recorded in Chart.lock.
#
# type: library — this is a manifest, not an installable umbrella chart. Each chart is still
# installed as its own release in its own namespace (see COMPONENTS in the Makefile).
#
# Change a version: edit it here, then `make charts-update` (rewrites Chart.lock) and commit both files.
apiVersion: v2
name: observability-hub-charts
description: Pinned upstream charts of the observability hub (dependency manifest, not installable)
type: library
version: 1.0.0
dependencies:
  # Prometheus Operator, Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter
  - name: kube-prometheus-stack
    version: 75.5.0
    repository: https://prometheus-community.github.io/helm-charts
  # Metrics (long-term), gateway mimir-nginx
  - name: mimir-distributed
    version: 5.7.0
    repository: https://grafana.github.io/helm-charts
  # Logs, gateway loki-gateway, canary
  - name: loki
    version: 6.30.1
    repository: https://grafana.github.io/helm-charts
  # Traces
  - name: tempo-distributed
    version: 1.42.2
    repository: https://grafana.github.io/helm-charts
  # Collector: releases grafana-alloy (DaemonSet) and grafana-alloy-events (events StatefulSet)
  - name: alloy
    version: 1.2.1
    repository: https://grafana.github.io/helm-charts
  # Continuous profiling
  - name: pyroscope
    version: 1.14.0
    repository: https://grafana.github.io/helm-charts
  # Probes
  - name: prometheus-blackbox-exporter
    version: 11.0.0
    repository: https://prometheus-community.github.io/helm-charts
  # eBPF auto-instrumentation
  - name: beyla
    version: 1.16.8
    repository: https://grafana.github.io/helm-charts
  # External Secrets Operator (AWS Secrets Manager → Kubernetes Secrets)
  - name: external-secrets
    version: 2.11.0
    repository: https://charts.external-secrets.io
