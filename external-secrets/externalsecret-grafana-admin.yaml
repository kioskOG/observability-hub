# Grafana local admin (break-glass login next to Keycloak SSO), monitoring namespace.
# AWS SM: observability-hub/grafana-admin → JSON {"username":"admin","password":"..."} (seed-aws-secrets.sh)
# Used by grafana.admin.existingSecret. Grafana applies it only when its database is created;
# for an existing install run `make grafana-admin-reset` after seeding / rotating.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: '{{ trim .username }}'
        admin-password: '{{ trim .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: observability-hub/grafana-admin
        property: username
    - secretKey: password
      remoteRef:
        key: observability-hub/grafana-admin
        property: password
