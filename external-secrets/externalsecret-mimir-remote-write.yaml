# Prometheus → Mimir remote_write credentials (monitoring namespace).
# AWS SM: observability-hub/mimir-remote-write → JSON {"username":"...","password":"..."}
# mimir-writer-<env> (seed-aws-secrets.sh ENVIRONMENT); the Mimir gateway pins it to tenant <env>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-remote-write-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mimir-remote-write-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: '{{ trim .username }}'
        password: '{{ trim .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: username
    - secretKey: password
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: password
