# Tempo metrics-generator → Mimir remote_write credentials (tempo namespace).
# AWS SM: observability-hub/mimir-remote-write → JSON {"username":"...","password":"..."}
# Consumed as env vars by the metrics-generator (-config.expand-env=true), see tempo-values-template.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-mimir-remote-write
  namespace: tempo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tempo-mimir-remote-write
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MIMIR_REMOTE_WRITE_USERNAME: '{{ trim .username }}'
        MIMIR_REMOTE_WRITE_PASSWORD: '{{ trim .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: username
    - secretKey: password
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: password
