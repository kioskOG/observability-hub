# Loki ruler → Mimir remote_write credentials (recording-rule output), loki namespace.
# AWS SM: observability-hub/mimir-remote-write → JSON {"username":"...","password":"..."}
# Consumed as env vars by the ruler (-config.expand-env=true), see loki-values-template.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-ruler-mimir-remote-write
  namespace: loki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: loki-ruler-mimir-remote-write
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MIMIR_REMOTE_WRITE_USERNAME: '{{ trim .username }}'
        MIMIR_REMOTE_WRITE_PASSWORD: '{{ trim .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: username
    - secretKey: password
      remoteRef:
        key: observability-hub/mimir-remote-write
        property: password
