# kube-prometheus-stack overrides for the upstream chart
# (prometheus-community/kube-prometheus-stack, version pinned in helm/Chart.yaml).
# Only values that differ from the chart defaults belong here; see the chart's values.yaml for the rest:
#   helm show values helm/charts/kube-prometheus-stack-<version>.tgz
# Grafana SSO settings are rendered separately from prometheus-values-template.yaml.

# Placement on the dedicated observability node group (label workload=observability,
# taint dedicated=observability:NoSchedule). Referenced below.
observabilityNodeSelector: &observabilityNodeSelector
  workload: observability
observabilityTolerations: &observabilityTolerations
  - key: dedicated
    operator: Equal
    value: observability
    effect: NoSchedule
# Prometheus external label "cluster". make install-kube-prometheus-stack sets it from CLUSTER_NAME;
# it must equal Alloy KUBE_CLUSTER_NAME.
clusterName: ""

# The stack's only Alertmanager: Prometheus, the Loki ruler and the Mimir ruler all send here.
# Receivers: set alertmanager.config (the chart default routes everything to the "null" receiver).
alertmanager:
  podDisruptionBudget:
    enabled: true
  alertmanagerSpec:
    replicas: 2 # HA pair (gossip-clustered): silences and notification log are replicated
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2-standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    nodeSelector: *observabilityNodeSelector
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    tolerations: *observabilityTolerations
grafana:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  tolerations: *observabilityTolerations
  nodeSelector: *observabilityNodeSelector
  env:
    # Loki + Mimir tenant of the "Loki" / "Mimir" datasources: prod | stage | dev (= Alloy ENVIRONMENT_NAME).
    TENANT: "dev"
  envValueFrom:
    LOKI_PASSWORD:
      secretKeyRef:
        name: grafana-auth-secrets
        key: LOKI_PASSWORD
    MIMIR_PASSWORD:
      secretKeyRef:
        name: grafana-auth-secrets
        key: MIMIR_PASSWORD
  replicas: 2
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: "13.1.0"
  # Local admin (break-glass next to SSO) from Secret grafana-admin-credentials (ExternalSecret →
  # Secrets Manager observability-hub/grafana-admin) instead of the chart default password.
  # Grafana reads it only when its database is created: `make grafana-admin-reset` applies a new one.
  admin:
    existingSecret: grafana-admin-credentials
  # Grafana SSO (auth.generic_oauth, server.root_url) comes from prometheus-values-template.yaml.
  grafana.ini:
    # No anonymous access: every user signs in (Keycloak SSO), roles come from Keycloak.
    auth.anonymous:
      enabled: false
    auth:
      disable_login_form: false
      disable_login: false
      disable_signout_menu: false
    feature_toggles:
      enable: "traceqlEditor,tempoServiceGraph,newNavigation,traceToMetrics,provisioning,kubernetesClientDashboardsFolders,kubernetesDashboards,grafanaAPIServerEnsureKubectlAccess,investigations"
    plugins:
      allow_loading_unsigned_plugins: grafana-investigations-app
  plugins:
    - grafana-exploretraces-app
    - grafana-investigations-app
  persistence:
    enabled: true
    type: sts
    storageClassName: "gp2-standard"
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection
  sidecar:
    dashboards:
      enableNewTablePanelSyntax: true
      multicluster:
        etcd:
          enabled: true
      provider:
        allowUiUpdates: true
  # Former per-namespace Loki tenants (replaced by the per-environment datasources below).
  deleteDatasources:
    - name: Loki (monitoring)
      orgId: 1
    - name: Loki (traces / spanlogs)
      orgId: 1
    - name: Loki (frontend / Faro)
      orgId: 1
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      uid: tempo
      url: http://tempo-query-frontend.tempo.svc.cluster.local:3200
      isDefault: false
      editable: true
      jsonData:
        httpMethod: GET
        # Tempo → Logs: span logs in the environment tenant (job=spanlogs); trace_id is structured metadata.
        tracesToLogsV2:
          datasourceUid: "loki"
          spanStartTimeShift: '-5m'
          spanEndTimeShift: '5m'
          filterByTraceID: false
          filterBySpanID: false
          tags: []
          customQuery: true
          query: '{job="spanlogs"} | trace_id=`$${__trace.traceId}`'
        tracesToMetrics:
          datasourceUid: "mimir"
          spanStartTimeShift: '-1h'
          spanEndTimeShift: '1h'
          tags: [{key: 'service.name', value: 'service_name'}]
        tracesToProfiles:
          datasourceUid: "pyroscope"
          tags: [{key: 'service.name', value: 'service_name'}]
          customQuery: false
          profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
        streamingEnabled:
          search: true
        traceQuery:
          timeShiftEnabled: true
        serviceMap:
          datasourceUid: "mimir"
        nodeGraph:
          enabled: true
        spanBar:
          datasourceUid: "mimir"
        lokiSearch:
          datasourceUid: 'loki'
    # Mimir / Loki tenant = environment. The gateways only let user grafana-reader use env tenants
    # (Mimir also "anonymous": metrics stored before multitenancy was enabled).
    - name: Mimir
      type: prometheus
      access: proxy
      uid: mimir
      url: http://mimir-nginx.mimir.svc.cluster.local/prometheus
      basicAuth: true
      basicAuthUser: grafana-reader
      secureJsonData:
        basicAuthPassword: $__env{MIMIR_PASSWORD}
        httpHeaderValue1: $__env{TENANT}
      isDefault: false
      editable: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
    # Cross-environment queries (Mimir tenant_federation); series carry a __tenant_id__ label.
    - name: Mimir (all environments)
      type: prometheus
      access: proxy
      uid: mimir-all
      url: http://mimir-nginx.mimir.svc.cluster.local/prometheus
      basicAuth: true
      basicAuthUser: grafana-reader
      secureJsonData:
        basicAuthPassword: $__env{MIMIR_PASSWORD}
        httpHeaderValue1: "prod|stage|dev"
      isDefault: false
      editable: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
    # Metrics written before multitenancy_enabled=true (read-only from now on).
    - name: Mimir (pre-tenancy history)
      type: prometheus
      access: proxy
      uid: mimir-anonymous
      url: http://mimir-nginx.mimir.svc.cluster.local/prometheus
      basicAuth: true
      basicAuthUser: grafana-reader
      secureJsonData:
        basicAuthPassword: $__env{MIMIR_PASSWORD}
        httpHeaderValue1: "anonymous"
      isDefault: false
      editable: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
    # All log streams of this environment; filter with labels: source, namespace, job.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      orgId: 1
      url: http://loki-gateway.loki.svc.cluster.local
      basicAuth: true
      basicAuthUser: grafana-reader
      secureJsonData:
        basicAuthPassword: $__env{LOKI_PASSWORD}
        httpHeaderValue1: $__env{TENANT}
      isDefault: false
      version: 1
      editable: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
        derivedFields: &lokiDerivedFields
          # Primary: trace_id structured metadata / label.
          - name: TraceID
            datasourceUid: tempo
            matcherType: label
            matcherRegex: "trace_id"
            url: "$${__value.raw}"
          # Fallback: trace id in the line (app logs, Faro, spanlogs trace_id= / legacy tid=).
          - name: TraceID (line)
            datasourceUid: tempo
            matcherType: regex
            matcherRegex: "(?:trace_id|TraceID|traceID|traceId|tid)[=:\\\" ]+([0-9a-fA-F]{16,32})"
            url: "$${__value.raw}"
    # Cross-environment search (Loki querier.multi_tenant_queries_enabled); results carry __tenant_id__.
    - name: Loki (all environments)
      type: loki
      uid: loki-all
      access: proxy
      orgId: 1
      url: http://loki-gateway.loki.svc.cluster.local
      basicAuth: true
      basicAuthUser: grafana-reader
      secureJsonData:
        basicAuthPassword: $__env{LOKI_PASSWORD}
        httpHeaderValue1: "prod|stage|dev"
      isDefault: false
      version: 1
      editable: true
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
        derivedFields: *lokiDerivedFields
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      access: proxy
      uid: pyroscope
      url: http://pyroscope-query-frontend.pyroscope.svc.cluster.local:4040
      isDefault: false
      editable: true
      jsonData:
        minStep: '15s'
  serviceMonitor:
    labels:
      release: kube-prometheus-stack
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  tolerations: *observabilityTolerations
  nodeSelector: *observabilityNodeSelector
prometheusOperator:
  admissionWebhooks:
    deployment:
      nodeSelector: *observabilityNodeSelector
      tolerations: *observabilityTolerations
    patch:
      nodeSelector: *observabilityNodeSelector
      tolerations: *observabilityTolerations
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: *observabilityNodeSelector
  tolerations: *observabilityTolerations
prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    enableFeatures:
      - exemplar-storage
      - native-histograms
    tolerations: *observabilityTolerations
    externalLabels: {cluster: '{{ .Values.clusterName | default "unknown-cluster" }}'}
    # Mimir HA tracker de-duplicates the two replicas on cluster / prometheus_replica.
    replicaExternalLabelName: "prometheus_replica"
    nodeSelector: *observabilityNodeSelector
    retention: 5d
    retentionSize: "40GB" # local TSDB is a buffer (Mimir is long-term); keep below the 50Gi PVC
    replicas: 2
    remoteWrite:
      - url: "http://mimir-nginx.mimir.svc.cluster.local:80/api/v1/push"
        name: mimir
        # camelCase queueConfig: the operator CRD silently prunes snake_case queue_config.
        queueConfig:
          maxSamplesPerSend: 1000
          batchSendDeadline: 5s
          maxShards: 10
          capacity: 50000
        # mimir-writer-<env>: the gateway pins the tenant to <env>.
        basicAuth:
          username:
            name: mimir-remote-write-credentials
            key: username
          password:
            name: mimir-remote-write-credentials
            key: password
    remoteWriteDashboards: true
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    # PVC-backed TSDB/WAL: remote_write resumes from the WAL after a pod is re-created.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2-standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
